name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated, not committed; typecheck and tests
      # import it, so it must exist before those steps run.
      - name: Generate Prisma client
        run: npm run generate -w apps/api

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Next bakes this at build time; a placeholder keeps the build
          # hermetic (no real backend is contacted during CI).
          NEXT_PUBLIC_API_URL: https://api.example.invalid
